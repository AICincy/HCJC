name: pra-daily

# Workflow permissions, scoped to the minimum each active step requires:
#   contents: write -- the "Commit PRA requests log" step pushes
#                      data/pra_requests.json back to the branch, but only
#                      when SMTP is configured. When JCSTREAM_PRA_SMTP_HOST is
#                      unset the two PRA send steps above still write a
#                      `status: dry_run` row to pra_requests.json locally, but
#                      the commit step's own `if:` guard skips the commit, so
#                      nothing is persisted to the branch. The write permission
#                      is therefore idle on unconfigured deployments and
#                      exercised only when the send loop is real.
#
# If the workflow ever stops committing anything (e.g. PRA loop moves
# entirely to a separate audit log), drop contents: write to read.

on:
  schedule:
    # 09:00 UTC = 05:00 EDT - early enough that the clerk's office sees it
    # at the start of the business day.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: jcstream-pra-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    name: Send daily PRA requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The secrets context is not allowed in step `if:` expressions
      # (GitHub rejects the whole file: "Unrecognized named-value:
      # 'secrets'", which killed this workflow's registration and its
      # daily cron). Map the send-gate secret through env so the commit
      # step's guard can test it legally.
      JCSTREAM_PRA_SMTP_HOST: ${{ secrets.JCSTREAM_PRA_SMTP_HOST }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt

      - name: PRA - daily new-capias roster (Clerk of Courts)
        env:
          JCSTREAM_PRA_SMTP_HOST: ${{ secrets.JCSTREAM_PRA_SMTP_HOST }}
          JCSTREAM_PRA_SMTP_PORT: ${{ secrets.JCSTREAM_PRA_SMTP_PORT }}
          JCSTREAM_PRA_SMTP_USER: ${{ secrets.JCSTREAM_PRA_SMTP_USER }}
          JCSTREAM_PRA_SMTP_PASS: ${{ secrets.JCSTREAM_PRA_SMTP_PASS }}
          JCSTREAM_PRA_FROM_EMAIL: ${{ secrets.JCSTREAM_PRA_FROM_EMAIL }}
          JCSTREAM_PRA_TO_CAPIAS_EMAIL: ${{ secrets.JCSTREAM_PRA_TO_CAPIAS_EMAIL }}
        run: python -m scraper.pra_capias

      - name: PRA - booking photos (HCSO Media Relations, fallback)
        if: ${{ vars.JCSTREAM_PRA_PHOTOS_ENABLED == '1' }}
        env:
          JCSTREAM_PRA_SMTP_HOST: ${{ secrets.JCSTREAM_PRA_SMTP_HOST }}
          JCSTREAM_PRA_SMTP_PORT: ${{ secrets.JCSTREAM_PRA_SMTP_PORT }}
          JCSTREAM_PRA_SMTP_USER: ${{ secrets.JCSTREAM_PRA_SMTP_USER }}
          JCSTREAM_PRA_SMTP_PASS: ${{ secrets.JCSTREAM_PRA_SMTP_PASS }}
          JCSTREAM_PRA_FROM_EMAIL: ${{ secrets.JCSTREAM_PRA_FROM_EMAIL }}
          JCSTREAM_PRA_TO_PHOTOS_EMAIL: ${{ secrets.JCSTREAM_PRA_TO_PHOTOS_EMAIL }}
        run: python -m scraper.pra

      - name: Commit PRA requests log
        # Skip on deployments where SMTP is not configured. With no SMTP host
        # the PRA send steps still write a dry_run row to data/pra_requests.json
        # locally, but this guard skips the whole commit step so nothing is
        # persisted and the contents: write token stays unexercised.
        if: ${{ env.JCSTREAM_PRA_SMTP_HOST != '' }}
        run: |
          git config user.name "jcstream-bot"
          git config user.email "noreply@github.com"
          git add data/pra_requests.json
          if ! git diff --cached --quiet; then
            git commit -m "data: pra log update $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin main
            git rebase origin/main || {
              echo "::warning::Rebase conflict detected; attempting merge"
              git rebase --abort
              git merge -X ours origin/main --no-edit || {
                echo "::error::Both rebase and merge failed"
                exit 1
              }
            }
            git push
          else
            echo "no changes"
          fi
