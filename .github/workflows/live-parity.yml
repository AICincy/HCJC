name: live-url-parity

# Alert-only production HTML freshness check. JSON contract and live JSON
# URL probes already run on pages.yml. This workflow has no write/pages
# permissions and no deploy step.

on:
  schedule:
    # Monday 04:40 UTC. Sweep cron drifts 3.5-5.5h, so this is not tied to
    # any particular sweep; it checks whatever main holds at run time.
    - cron: '40 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jcstream-live-url-parity
  cancel-in-progress: true

jobs:
  html-freshness:
    name: Check published HTML freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build candidate HTML from tip data
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: www.aretheyinjail.com
        run: python -m web.build
      - name: Verify live HTML freshness
        # No recovery mode: a missing stamp, malformed stamp, HTTP/TLS error,
        # stale page, or candidate regression returns non-zero. The explicit
        # pages make the multi-page policy reviewable without probing every
        # inmate detail URL on every Monday gate.
        run: >-
          python scripts/verify_live_html_freshness.py
          --site https://www.aretheyinjail.com
          --local docs
          --data data/current.json
          --max-lag-hours 26
          --timeout 10
          --fail-on-live-newer
          --page index.html
          --page data/index.html
          --page help/index.html
          --page stats/index.html
          --page transparency/index.html
