name: rebuild-site

# Build docs/ from the current tree without scraping HCSO.
# Use after a UI merge so Pages does not wait on the next sweep cron.
# Own concurrency group so a 50-minute scrape does not stall a UI publish.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Separate from sweep so a 50-minute scrape does not stall a UI publish.
  # M-3 abort below handles a rare simultaneous docs/ push.
  group: jcstream-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build site only
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build static site
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: www.aretheyinjail.com
        run: python -m web.build
      - name: Commit built site
        env:
          GIT_COMMIT_NAME: jcstream-bot
          GIT_COMMIT_EMAIL: noreply@github.com
        run: bash scripts/commit_generated_changes.sh main "data+site: rebuild $(date -u +%Y-%m-%dT%H:%MZ)" data/ docs/
