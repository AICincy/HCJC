name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      # Sweep/rebuild commits only rewrite generated snapshots. The side-branch
      # and pull-request gap is owned by lint.yml; this workflow is main-only.
      - "data/**"
      - "docs/**"
  # Pull requests and side-branch pushes are owned by lint.yml. Keeping the
  # full matrix on main only avoids running Ruff/pytest twice on every PR while
  # preserving the merge-time checks on the protected branch.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.16.7 mypy==2.3.1  # unified with pyproject.toml [project.optional-dependencies] dev
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy scraper web
      - name: Dependency CVE scan (pip-audit)
        # Gate the pinned runtime deps against the Python advisory DB. Scoped to
        # requirements.txt so a newly disclosed CVE in a shipped dependency
        # fails CI until the pin is bumped. Dev-only tool, not added to
        # requirements.txt itself.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - run: python -m pytest -v
      - name: Verify WAF-block evidence chain
        # Walk the prev_sha256 hash chain in data/waf_block_log.json. Exits 0
        # when intact (or absent/empty), 1 on a broken link OR an unreadable
        # file, so an out-of-band edit -- or a corrupt -- committed evidence
        # log fails CI (C-1).
        run: python -m scraper.verify_block_log
      - name: WAF-block log presence + monotonicity guard
        # A-2: the chain check above passes on a missing log, so assert the
        # file exists, is non-empty, and never shrinks. A sweep bug deleting
        # or truncating the evidence log must fail CI.
        #
        # Baseline semantics: on push events (the dominant trigger, including
        # every scheduled sweep) origin/main resolves to the pushed commit
        # itself in the post-push checkout, so comparing against it would be
        # vacuous. The meaningful baseline is the pre-push tip,
        # github.event.before. On branch creation before is the all-zeros
        # ref and on pull_request events it is not a main baseline, so both
        # cases fall back to origin/main.
        env:
          A2_BASELINE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          ALL_ZEROS=0000000000000000000000000000000000000000
          BASELINE_SHA="$A2_BASELINE_SHA"
          if [ -n "$BASELINE_SHA" ] && [ "$BASELINE_SHA" != "$ALL_ZEROS" ]; then
            # The default shallow checkout does not guarantee the pre-push
            # tip is present, so fetch it explicitly. On a normal (non
            # force) push it is an ancestor of origin/main and therefore
            # fetchable by SHA. A failed fetch degrades to the origin/main
            # fallback below rather than failing the build.
            git fetch --no-tags --depth=1 origin "$BASELINE_SHA" || BASELINE_SHA=""
          fi
          export BASELINE_SHA
          python - <<'EOF'
          import json, os, subprocess, sys
          from pathlib import Path
          p = Path("data/waf_block_log.json")
          if not p.exists() or p.stat().st_size == 0:
              sys.exit("A-2: data/waf_block_log.json is missing or empty")
          current = len(json.loads(p.read_text(encoding="utf-8")))
          baseline = os.environ.get("BASELINE_SHA", "")
          prev = None
          baseline_name = None
          for ref, name in ((baseline, "pre-push tip"), ("origin/main", "main")):
              if not ref:
                  continue
              r = subprocess.run(
                  ["git", "show", f"{ref}:data/waf_block_log.json"],
                  capture_output=True, text=True,
              )
              if r.returncode == 0 and r.stdout.strip():
                  prev = len(json.loads(r.stdout))
                  baseline_name = name
                  break
          if prev is None:
              print(f"WAF log OK: {current} records (no baseline to compare)")
          else:
              if current < prev:
                  sys.exit(
                      f"A-2: WAF evidence log shrank: {prev} -> {current} records"
                  )
              print(f"WAF log OK: {current} records ({baseline_name} had {prev})")
          EOF

  build:
    name: Build static site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build site and verify custom domain
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: "www.aretheyinjail.com"
        run: |
          python -m web.build
          test -f docs/CNAME || { echo "::error::docs/CNAME not written by build"; exit 1; }
          grep -q "aretheyinjail.com" docs/CNAME || { echo "::error::docs/CNAME content wrong"; exit 1; }
          python scripts/verify_public_data.py
          echo "CNAME OK: $(cat docs/CNAME)"
      - name: Stage Pages deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pages-build-${{ github.run_id }}
          path: docs/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend (Node)
    # The service under backend/ is outside the Python pipeline that `test`
    # and `build` cover, so it gets its own job. Without this the Node code
    # ships with no syntax check, no dependency gate, and no proof it boots.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # `ci` not `install`: fails when package.json and package-lock.json
      # disagree, so the committed lockfile is the contract.
      - run: npm ci
      - name: Syntax check
        run: node --check src/index.js
      - name: Dependency CVE scan (npm audit)
        # Mirrors the pip-audit gate above. Held at high/critical rather than
        # "any advisory" because the Node tree is almost entirely transitive
        # (13 packages for one direct dependency), and a low-severity advisory
        # with no available bump would otherwise block every PR, data sweeps
        # included, with no action available to clear it.
        run: npm audit --audit-level=high
      - name: Smoke test
        # Proves the service boots and enforces its auth modes. A dummy project
        # URL suffices: /health needs SUPABASE_URL present but makes no
        # outbound call, and /me must reject before any JWKS fetch, so this
        # step passes with no network access to Supabase.
        env:
          SUPABASE_URL: https://ci-smoke.invalid.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_smoke_placeholder
        run: |
          node src/index.js & SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true' \
            || { echo "::error::/health did not return ok"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/me)
          [ "$code" = "401" ] \
            || { echo "::error::/me returned $code for an unauthenticated request, expected 401"; exit 1; }
          echo "backend smoke OK: /health 200, /me 401"
