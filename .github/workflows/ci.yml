name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.15.15 mypy==2.1.0
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy scraper web
      - name: Dependency CVE scan (pip-audit)
        # Gate the pinned runtime deps against the Python advisory DB. Scoped to
        # requirements.txt so a newly disclosed CVE in a shipped dependency
        # fails CI until the pin is bumped. Dev-only tool, not added to
        # requirements.txt itself.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - run: python -m pytest -v
      - name: Verify WAF-block evidence chain
        # Walk the prev_sha256 hash chain in data/waf_block_log.json. Exits 0
        # when intact (or absent/empty), 1 on a broken link, so an out-of-band
        # edit to the committed evidence log fails CI.
        run: python -m scraper.verify_block_log
      - name: Verify PRA send log chain
        # Walk the prev_sha256 hash chain in data/pra_requests.json. Same
        # integrity guarantee as the WAF block log above.
        run: python -m scraper.verify_pra_log
      - name: Build site from empty data (smoke test)
        # Mirror the production sweep env so this smoke test catches any
        # deployment-config drift (root-relative paths).
        env:
          JCSTREAM_SITE_BASE_URL: ""
        run: python -m web.build

      - name: Verify CNAME written when custom domain env var is set
        # Catches any build regression that drops the _write_cname call.
        # GitHub Pages silently stops serving the custom domain if CNAME
        # disappears from docs/; this makes that a CI failure.
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: "www.aretheyinjail.com"
        run: |
          python -m web.build
          test -f docs/CNAME || { echo "::error::docs/CNAME not written by build"; exit 1; }
          grep -q "aretheyinjail.com" docs/CNAME || { echo "::error::docs/CNAME content wrong"; exit 1; }
          echo "CNAME OK: $(cat docs/CNAME)"
