name: pages

# Deploys the pre-built docs/ tree to GitHub Pages via the Actions pipeline,
# replacing the built-in "Deploy from a branch" flow. The built-in flow fired
# on every push to main (sweep commits AND doc-only merges) with no
# configurable concurrency, so bursts of pushes collided and the losing
# deploys failed with "Deployment failed, try again later". This workflow
# fixes both causes:
#   1. paths filter: only docs/** pushes deploy, so doc-only merges
#      (CLAUDE.md, audit/, .github/) never trigger a deploy.
#   2. concurrency group: deploys serialize instead of racing.
#
# One-time setup (owner-side, cannot be done from a workflow):
#   Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Until that is set, this workflow's deploy step fails while branch-serving
# keeps serving; after it is set, this workflow owns deploys and the built-in
# pages-build-deployment runs stop.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Allow one deployment at a time, queueing newer pushes behind the run in
  # progress instead of letting them collide. In-progress production deploys
  # are allowed to finish (cancel-in-progress: false).
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/ to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
