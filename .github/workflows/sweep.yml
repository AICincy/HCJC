name: sweep

# Workflow permissions, scoped to the minimum each active step requires:
#   contents: write -- the "Commit data + built site" step pushes new sweep
#                      data and the regenerated docs/ tree back to the branch.
#   issues:   write -- the "Roster freeze alarm" step opens (and dedupes) a
#                      GitHub issue when the roster freeze passes
#                      ROSTER_STALE_ALARM_HOURS (scraper/freeze_alert.py).
#
# Permissions deliberately NOT requested:
#   pages:    write -- the deploy-pages path is commented out (see the
#                      "upload-pages-artifact" / "deploy-pages" steps further
#                      down). Pages now serves directly from docs/ on the
#                      working branch via Settings > Pages > Source = branch.
#   id-token: write -- only deploy-pages@v4 needed an OIDC token; that step
#                      is no longer active.
# If the deploy-pages path is ever re-enabled, restore pages: write and
# id-token: write together; do not re-grant either without the other.

on:
  schedule:
    # Hourly. The Python skip-gate already refuses anything younger than
    # 20 minutes, and Actions cron is best-effort with multi-hour gaps.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      max_surnames:
        description: 'Cap the surname list (blank = use all)'
        required: false
        default: ''
      refresh_known:
        description: 'Re-fetch detail pages for already-known inmates'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  # Lets the roster-freeze alarm open a GitHub issue when the roster has been
  # frozen past the alarm window (scraper.freeze_alert).
  issues: write

concurrency:
  # Never run two sweeps simultaneously; cancel-in-progress: false queues
  # the newer run so they don't collide on the GitHub Pages deployment API.
  group: jcstream-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep + build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt

      - name: HCSO inmate sweep
        # JCSTREAM_USER_AGENT is intentionally not overridden here: the module
        # default (scraper.client.DEFAULT_UA) carries the contact URL plus the
        # parallelism-limited descriptor. Two sources of truth invite drift.
        #
        # JCSTREAM_HTTP_PROXY (optional secret): when HCSO's WAF blocks the
        # Actions runner IP, set this repo secret to an egress proxy URL and
        # the HCSO fetches route through it. Unset = direct connection (the
        # secret resolves to "" which scraper.client treats as no proxy).
        env:
          JCSTREAM_HTTP_PROXY: ${{ secrets.JCSTREAM_HTTP_PROXY }}
          JCSTREAM_CAPTURE_EGRESS: "1"
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          SWEEP_MAX_SURNAMES: ${{ inputs.max_surnames }}
          SWEEP_REFRESH_KNOWN: ${{ inputs.refresh_known }}
        run: |
          sweep_args=()
          if [ -n "$SWEEP_MAX_SURNAMES" ]; then
            sweep_args+=(--max-surnames "$SWEEP_MAX_SURNAMES")
          fi
          if [ "$SWEEP_REFRESH_KNOWN" = "true" ]; then
            sweep_args+=(--refresh-known)
          fi
          python -m scraper.sweep "${sweep_args[@]}"

      - name: Roster freeze alarm
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scraper.freeze_alert

      - name: Open data feeds and correlate
        continue-on-error: true
        run: |
          python -m scraper.cfs --hours 720 || true
          python -m scraper.shootings --days 30 || true
          python -m scraper.cfs_pdi --hours 720 || true
          python -m scraper.open_data_feeds || true
          python -m scraper.correlate || true

      - name: Build static site
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: www.aretheyinjail.com
        run: python -m web.build

      - name: Commit data + built site
        run: |
          git config user.name "jcstream-bot"
          git config user.email "noreply@github.com"
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m "data+site: sweep $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin
            git rebase origin/main || {
              echo "::error::Rebase conflict detected; refusing merge fallback (M-3). Aborting push; next cycle retries from a fresh sweep."
              git rebase --abort
              exit 1
            }
            git push
          else
            echo "no changes"
          fi

      - name: Deploy staleness alarm
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scraper.deploy_alert
