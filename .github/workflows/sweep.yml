name: sweep

# Workflow permissions, scoped to the minimum each active step requires:
#   contents: write -- the publish step pushes new sweep data AND the rebuilt
#                      docs/ tree. Pages is still Settings > Source =
#                      "Deploy from a branch" (build_type=legacy); every push
#                      to main triggers the built-in pages-build-deployment,
#                      so the committed docs/ IS the live site.
#   issues:   write -- the "Roster freeze alarm" step opens (and dedupes) a
#                      GitHub issue. The deploy-staleness alarm lives in
#                      staleness-watchdog.yml, off this workflow's schedule.
#
# Permissions deliberately NOT requested:
#   pages:    write -- legacy branch-serve does not need the Actions Pages
#                      token. pages.yml remains as a secondary verified-artifact
#                      path once build_type is flipped to workflow.
#   id-token: write -- only the pages.yml deployment job needs OIDC.

on:
  schedule:
    # Request two starts per hour at :07 and :37 to avoid the top-of-hour
    # contention pattern already observed in this repository. Actions cron is
    # still best-effort and can drift or drop runs, but the 30-minute spacing
    # means the Python 20-minute skip-gate does not suppress a healthy second
    # opportunity. The separate watchdog detects longer stalls.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      max_surnames:
        description: 'Cap the surname list (blank = use all)'
        required: false
        default: ''
      refresh_known:
        description: 'Re-fetch detail pages for already-known inmates'
        type: boolean
        required: false
        default: false
  # External clock (PAT, Grok automation, or other dispatcher) uses this so
  # freshness does not depend on GitHub delivering the schedule cron.
  repository_dispatch:
    types: [jcstream-sweep]

permissions:
  contents: write
  issues: write

concurrency:
  group: jcstream-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep + build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fresh tip, not the trigger SHA: a run that waited in the
          # concurrency queue must scrape from current main, otherwise the
          # publish step rebases wholesale-rewritten data/*.json onto a
          # newer sweep commit and fails on textual conflicts.
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt

      - name: HCSO inmate sweep
        env:
          JCSTREAM_HTTP_PROXY: ${{ secrets.JCSTREAM_HTTP_PROXY }}
          JCSTREAM_CAPTURE_EGRESS: "1"
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          SWEEP_MAX_SURNAMES: ${{ inputs.max_surnames }}
          SWEEP_REFRESH_KNOWN: ${{ inputs.refresh_known }}
        run: |
          sweep_args=()
          if [ -n "$SWEEP_MAX_SURNAMES" ]; then
            sweep_args+=(--max-surnames "$SWEEP_MAX_SURNAMES")
          fi
          if [ "$SWEEP_REFRESH_KNOWN" = "true" ]; then
            sweep_args+=(--refresh-known)
          fi
          python -m scraper.sweep "${sweep_args[@]}"

      - name: Roster freeze alarm
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scraper.freeze_alert

      - name: Open data feeds and correlate
        continue-on-error: true
        run: |
          python -m scraper.cfs --hours 720 || true
          python -m scraper.shootings --days 30 || true
          python -m scraper.cfs_pdi --hours 720 || true
          python -m scraper.open_data_feeds || true
          python -m scraper.correlate || true

      - name: Build static site
        env:
          JCSTREAM_SITE_BASE_URL: ""
          JCSTREAM_CNAME: www.aretheyinjail.com
        # Write into docs/ (DEFAULT_OUT). Legacy branch-serve publishes the
        # committed docs/ tree; a /tmp-only build is discarded and leaves the
        # live site frozen on the last committed skeleton (issue #496).
        run: python -m web.build

      - name: Commit generated source data and docs
        env:
          GIT_COMMIT_NAME: jcstream-bot
          GIT_COMMIT_EMAIL: noreply@github.com
        run: |
          bash scripts/commit_generated_changes.sh main "data: sweep $(date -u +%Y-%m-%dT%H:%MZ)" data/ docs/
