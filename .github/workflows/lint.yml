# Fast feedback on pull requests: ruff + pytest only.
#
# History: this file was misnamed `pylint.yml` by the run that replaced
# Pylint with Ruff (the lint-workflow fix in #495) while the workflow actually
# executes Ruff and pytest. The filename now says what runs. The display name
# (`Lint`) and job id (`lint`) are kept byte-identical so any check-name
# reference keeps resolving across the rename.
#
# Split of duties: `ci.yml` owns the full merge gate (mypy, pip-audit, the
# 3.13/3.14 matrix, WAF evidence chain, backend smoke) on pull requests and
# pushes to main. This workflow is the fast PR check only. A side-branch
# push trigger plus pull_request doubled runner demand and cancelled the
# prior SHA mid-job (often before ruff/pytest). Open a PR for Lint.
name: Lint

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      # Same environment contract as ci.yml: pinned runtime deps, then the
      # pinned lint tool. The previous `-e ".[dev]"` install floated the
      # dependency set away from the requirements.txt that ci.yml audits.
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.16.7  # unified with ci.yml and pyproject [dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: python -m pytest
