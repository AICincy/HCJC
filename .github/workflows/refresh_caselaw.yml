name: refresh-caselaw

# Pulls fresh Ohio appellate case law for the top ORC sections on the current
# roster via CourtListener's public REST API and commits the updated cache to
# data/orc_caselaw.json. Separate from sweep.yml because:
#
#   - The data is much slower-moving than the sweep (appellate opinions land
#     daily, not every 30 minutes). Weekly is plenty.
#   - CourtListener rate-limits unauthenticated traffic to 60 req/min and we
#     don't want a sweep flake to spend that budget.
#   - Failures should NOT block a sweep cycle. This workflow can fail
#     silently and the statute page renders fine with the previous cache.
#
# Cache schema and refresh logic: scripts/refresh_caselaw.py.
# Audit reference: audit/12 (Cloudflare migration plan) and audit/11 cross-ref.

on:
  schedule:
    # Sundays 06:00 UTC (~02:00 ET) - off-peak; gives the run plenty of room
    # before Monday-morning court schedules tip courts data.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs on main (the only branch). The commit lands directly on main; there is
# no dev branch and no merge step.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh ORC case-law cache
        run: |
          python3 scripts/refresh_caselaw.py

      - name: Commit if changed
        env:
          # Keep the ref in the environment rather than interpolating it into
          # shell source; the shared publisher performs the guarded rebase.
          TARGET_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT_NAME: jcstream-caselaw-bot
          GIT_COMMIT_EMAIL: noreply@aretheyinjail.com
        run: bash scripts/commit_generated_changes.sh "$TARGET_BRANCH" "data: weekly refresh of orc_caselaw.json from CourtListener" data/orc_caselaw.json
