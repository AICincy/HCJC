name: clerk-pra-packets

# Daily draft packet plus manual dispatch. Writes tracked packet files under
# pra_requests/ on main and also uploads the folder as an artifact.
# Letters are drafts; a human fills the sender block and sends them.
# JCStream never sends.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Packet folder date (YYYY-MM-DD, unpadded ok; default: today UTC)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Write tracked PRA packet
        env:
          PACKET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$PACKET_DATE" ]; then
            python -m scraper.clerk_pra_track --date "$PACKET_DATE"
          else
            python -m scraper.clerk_pra_track
          fi

      - name: Commit packet and historicals
        env:
          GIT_COMMIT_NAME: jcstream-bot
          GIT_COMMIT_EMAIL: noreply@github.com
        run: |
          bash scripts/commit_generated_changes.sh main \
            "pra: packet $(date -u +%Y-%m-%dT%H:%MZ)" \
            pra_requests/

      - name: Upload packet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clerk-pra-packets
          path: pra_requests/
          retention-days: 90
