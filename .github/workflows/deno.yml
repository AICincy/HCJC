# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      - name: Detect Deno project
        id: deno_project
        run: |
          if git ls-files | grep -Eq '(^|/)deno\.jsonc?$'; then
            echo "has_deno_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deno_project=false" >> "$GITHUB_OUTPUT"
            echo "No deno.json or deno.jsonc found; skipping Deno lint/test."
          fi

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Run linter
        if: steps.deno_project.outputs.has_deno_project == 'true'
        run: deno lint

      - name: Run tests
        if: steps.deno_project.outputs.has_deno_project == 'true'
        run: deno test -A
