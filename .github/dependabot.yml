version: 2

updates:
  # GitHub Actions: keep SHA-pinned actions current. Dependabot updates the
  # commit hash and the trailing version comment together, so the pin stays
  # intact while the action advances.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
    groups:
      # Batch all action bumps into a single PR per cycle to reduce noise.
      actions:
        patterns:
          - "*"

  # Python pip: track requirements.txt and pyproject.toml. PRs land one
  # package at a time so a broken wheel doesn't block unrelated updates.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(pip)"
    labels:
      - dependencies
    open-pull-requests-limit: 15
